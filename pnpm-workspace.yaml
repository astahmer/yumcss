enableGlobalVirtualStore: true

packages:
  - packages/*
  - apps/*
  - benchmarks/*
  - examples/*
  - docs
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  fsevents: false
  msgpackr-extract: true
  sharp: true
minimumReleaseAgeExclude:
  - "@stylexjs/stylex@0.19.1"
  - next-yak@9.10.0
  - yak-swc@9.10.0
  - "@stylexjs/babel-plugin@0.19.1"
  - "@stylexjs/shared@0.19.1"
