name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: nub run --filter pandwind --filter pandwind-codemod --filter pandwind-analyze --filter @pandwind/lint-plugin build

      # The runtime-size regression gate (three layers: hard budgets,
      # tolerance guard, exact snapshot) runs inside `pandwind test`.
      - name: Test (includes runtime-size gate)
        run: nub run --filter pandwind test

      - name: Codemod and analyzer tests
        run: nub run --filter pandwind-codemod test && nub run --filter pandwind-analyze test

      - name: Type tests (tstyche)
        run: nub run --filter pandwind test:types

      - name: Typecheck
        run: nub run typecheck

      - name: Lint (oxlint)
        run: nub run lint

      - name: Format check (oxfmt)
        run: nub run format

      - name: Production ownership and pivot gates
        run: nub run knip:production && nub run pivot:proof

  # Preview tarballs for every PR (pkg.pr.new) — installable without merging.
  # Preview the same built package shape that will be published; failures are
  # non-blocking because pkg.pr.new is only a convenience lane.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: nub run --filter pandwind --filter pandwind-codemod --filter pandwind-analyze --filter @pandwind/lint-plugin build
      - run: npx pkg-pr-new publish './packages/pandwind' './packages/codemod' './packages/analyze' './packages/lint-plugin'
