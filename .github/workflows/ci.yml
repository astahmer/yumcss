name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter pandwind --filter pandwind-codemod --filter pandwind-analyze --filter pandwind-devtools --filter @pandwind/lint-plugin run build

      # The runtime-size regression gate (three layers: hard budgets,
      # tolerance guard, exact snapshot) runs inside `pandwind test`.
      - name: Test (includes runtime-size gate)
        run: pnpm --filter pandwind run test

      - name: Codemod, analyzer, and DevTools tests
        run: pnpm --filter pandwind-codemod run test && pnpm --filter pandwind-analyze run test && pnpm --filter pandwind-devtools run test

      - name: Type tests (tstyche)
        run: pnpm --filter pandwind run test:types

      - name: Typecheck
        run: pnpm run typecheck

      - name: TypeScript performance snapshot
        run: pnpm run bench:tsc

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format

      - name: Generated artifact freshness
        run: pnpm run generated:check

      - name: Production ownership and pivot gates
        run: >-
          pnpm run knip:production &&
          pnpm run generated:budget &&
          pnpm run pivot:proof &&
          pnpm run pivot:proof:installed:routes

  # Preview tarballs for every PR (pkg.pr.new) — installable without merging.
  # Preview the same built package shape that will be published; failures are
  # non-blocking because pkg.pr.new is only a convenience lane.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pandwind --filter pandwind-codemod --filter pandwind-analyze --filter pandwind-devtools --filter @pandwind/lint-plugin run build
      - run: npx pkg-pr-new publish './packages/pandwind' './packages/codemod' './packages/analyze' './packages/devtools' './packages/lint-plugin'
