name: Pivot proof matrix

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: pivot-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for adapter browser proofs
        run: pnpm exec playwright install --with-deps chromium

      - name: Build publishable packages
        run: pnpm --filter yumcss --filter @yumcss/codemod --filter @yumcss/analyze --filter @yumcss/devtools --filter @yumcss/lint-plugin run build

      - name: Run pinned reference corpus and offline gate
        env:
          YUMCSS_PROOF_OUTPUT: ${{ runner.temp }}/yumcss-pivot-proof/real-repository-migrations-v2.json
        run: pnpm run pivot:proof:references

      - name: Run pinned adapter browser proof
        env:
          YUMCSS_ADAPTER_REFERENCE_PROOF_OUTPUT: ${{ runner.temp }}/yumcss-pivot-proof/adapter-reference-proof.json
        run: pnpm run references:deps && pnpm run pivot:proof:adapters

      - name: Typecheck generated adapter output against real packages
        env:
          YUMCSS_ADAPTER_EXECUTABLE_PROOF_OUTPUT: ${{ runner.temp }}/yumcss-pivot-proof/adapter-executable-proof.json
        run: pnpm run pivot:proof:adapter-output

      - name: Verify Chakra target output against published types
        run: pnpm run pivot:proof:chakra

      - name: Run installed promotion proofs
        run: pnpm run pivot:proof:installed && pnpm run pivot:proof:installed:emotion && pnpm run pivot:proof:installed:routes:run

      - name: Upload source-only proof report
        uses: actions/upload-artifact@v4
        with:
          name: pivot-proof-report
          path: ${{ runner.temp }}/yumcss-pivot-proof/real-repository-migrations-v2.json
          if-no-files-found: error

      - name: Upload adapter browser proof report
        uses: actions/upload-artifact@v4
        with:
          name: pivot-adapter-reference-proof
          path: ${{ runner.temp }}/yumcss-pivot-proof/adapter-reference-proof.json
          if-no-files-found: error

      - name: Upload executable adapter proof report
        uses: actions/upload-artifact@v4
        with:
          name: pivot-adapter-executable-proof
          path: ${{ runner.temp }}/yumcss-pivot-proof/adapter-executable-proof.json
          if-no-files-found: error
