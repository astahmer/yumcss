name: Pivot proof matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: pivot-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: nubjs/setup-nub@v0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pinned reference corpus and offline gate
        env:
          PANDWIND_PROOF_OUTPUT: ${{ runner.temp }}/pandwind-pivot-proof/real-repository-migrations-v2.json
        run: nub run pivot:proof:references

      - name: Run pinned adapter browser proof
        env:
          PANDWIND_ADAPTER_REFERENCE_PROOF_OUTPUT: ${{ runner.temp }}/pandwind-pivot-proof/adapter-reference-proof.json
        run: nub run references:deps && nub run pivot:proof:adapters

      - name: Run installed promotion proofs
        run: nub run pivot:proof:installed && nub run pivot:proof:installed:emotion

      - name: Upload source-only proof report
        uses: actions/upload-artifact@v4
        with:
          name: pivot-proof-report
          path: ${{ runner.temp }}/pandwind-pivot-proof/real-repository-migrations-v2.json
          if-no-files-found: error

      - name: Upload adapter browser proof report
        uses: actions/upload-artifact@v4
        with:
          name: pivot-adapter-reference-proof
          path: ${{ runner.temp }}/pandwind-pivot-proof/adapter-reference-proof.json
          if-no-files-found: error
