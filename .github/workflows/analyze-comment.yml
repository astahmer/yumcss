# Reusable PR-comment workflow for the yumcss analyze CLI (plans/023 #5).
#
# Consumes `yumcss analyze --json` from HEAD and the base ref, diffs CSS
# size, and posts/updates ONE sticky PR comment (marker-keyed so re-runs edit
# in place). Purely informational: reporting failures never turn the run red.
#
# Consumption from another repository:
#
#   jobs:
#     analyze:
#       uses: yumcss/.github/.github/workflows/analyze-comment.yml@main
#       with:
#         base-ref: main
#         working-directory: .
#         app-dir: examples/example
#       secrets:
#         github-token: ${{ secrets.GITHUB_TOKEN }}
#
# On pull_request events the PR number is auto-detected; for workflow_dispatch
# pass `pr-number` explicitly to target a comment thread.

name: Analyze comment

on:
  workflow_call:
    inputs:
      base-ref:
        description: Branch to diff against
        type: string
        default: main
      working-directory:
        description: Checkout subdirectory the repo lives in
        type: string
        default: "."
      app-dir:
        description: App dir containing src/ with the generated tw.ts
        type: string
        default: examples/example
      patterns:
        description: Analyze file globs (relative to app-dir)
        type: string
        default: "src/**/*.{ts,tsx}"
      pr-number:
        description: PR number for dispatch runs (auto-detected on pull_request)
        type: string
        default: ""
      yumcss-version:
        description: Published @yumcss/analyze version to execute
        type: string
        default: latest
    secrets:
      github-token:
        required: false
  workflow_dispatch:
    inputs:
      base-ref:
        description: Branch to diff against
        type: string
        default: main
      working-directory:
        description: Checkout subdirectory the repo lives in
        type: string
        default: "."
      app-dir:
        description: App dir containing src/ with the generated tw.ts
        type: string
        default: examples/example
      patterns:
        description: Analyze file globs (relative to app-dir)
        type: string
        default: "src/**/*.{ts,tsx}"
      pr-number:
        description: PR number to comment on (empty = report only, no comment)
        type: string
        default: ""
      yumcss-version:
        description: Published @yumcss/analyze version to execute
        type: string
        default: latest

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: analyze-comment-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref }}
          path: base-checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          # This workflow is reusable from repositories that do not contain
          # YumCSS's root package.json, so keep an explicit external pin.
          version: 12.3.4

      - name: Measure HEAD and base
        env:
          APP_DIR: ${{ inputs.app-dir }}
          PATTERNS: ${{ inputs.patterns }}
          WORK_DIR: ${{ inputs.working-directory }}
          YUMCSS_VERSION: ${{ inputs.yumcss-version }}
        run: |
          set -e
          WORK_DIR="${WORK_DIR#./}"
          if [ "$WORK_DIR" = "." ]; then WORK_DIR=""; fi
          WORK_ROOT="$GITHUB_WORKSPACE${WORK_DIR:+/$WORK_DIR}"
          BASE_ROOT="$GITHUB_WORKSPACE/base-checkout${WORK_DIR:+/$WORK_DIR}"
          HEAD_APP_ROOT="$WORK_ROOT/$APP_DIR"
          BASE_APP_ROOT="$BASE_ROOT/$APP_DIR"
          cd "$WORK_ROOT"
          pnpm dlx --package "@yumcss/analyze@$YUMCSS_VERSION" yumcss-analyze \
            "$PATTERNS" --tw "$HEAD_APP_ROOT/src/tw.ts" --root "$HEAD_APP_ROOT" \
            --json --css > /tmp/analyze-head.json
          pnpm dlx --package "@yumcss/analyze@$YUMCSS_VERSION" yumcss-analyze \
            "$PATTERNS" --tw "$BASE_APP_ROOT/src/tw.ts" --root "$BASE_APP_ROOT" \
            --json --css > /tmp/analyze-base.json || \
            echo '{"schema":"yumcss.analyze/1"}' > /tmp/analyze-base.json

      - name: Check out YumCSS comment renderer
        uses: actions/checkout@v4
        with:
          repository: astahmer/yumcss
          ref: main
          path: .yumcss-workflow
          sparse-checkout: .github/scripts/analyze-comment.mjs
          sparse-checkout-cone-mode: false

      - name: Post / update PR comment
        env:
          GH_TOKEN: ${{ secrets.github-token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF_NAME: ${{ inputs.base-ref }}
        run: |
          node .yumcss-workflow/.github/scripts/analyze-comment.mjs \
            /tmp/analyze-head.json /tmp/analyze-base.json
        continue-on-error: true
