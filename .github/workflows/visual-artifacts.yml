name: Visual artifacts

# Screenshots of the three example sandboxes on every PR, uploaded as
# artifacts for manual comparison (plans/023 — no baseline-diff service).
#
# The web examples' e2e suites accept PW_SCREENSHOT=<path> and capture a
# full-page shot after their assertions pass; opentui's PTY smoke already
# writes its frame capture to a fixed path.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOT_DIR: visual-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install chromium (playwright cache)
        run: npx playwright@1.61.1 install --with-deps chromium

      - name: css-example capture
        working-directory: examples/css-example
        env:
          PW_SCREENSHOT: ${{ github.workspace }}/visual-artifacts/css-example.png
        run: node test/e2e.mjs

      - name: rn-example capture
        working-directory: examples/rn-example
        env:
          PW_SCREENSHOT: ${{ github.workspace }}/visual-artifacts/rn-example.png
        run: node test/e2e.mjs

      - name: opentui capture
        working-directory: examples/opentui-example
        env:
          OPENTUI_CAPTURE: ${{ github.workspace }}/visual-artifacts/opentui-frame.txt
        run: bash test/e2e.sh

      - uses: actions/upload-artifact@v4
        with:
          name: example-screenshots
          path: visual-artifacts/
          if-no-files-found: warn
